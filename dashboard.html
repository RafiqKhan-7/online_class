<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <aside class="sidebar">
        <div class="sidebarTitle">
            <h2>Sufra Console</h2>
            <span>All 0 restaurants</span>
        </div>
        <div class="sidebarList">
            <nav>
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="orders.html">Orders</a>
                <a href="menu.html">Menu</a>
            </nav>
        </div>
    </aside>

    <div class="main">
        <header class="navbar">
            <div class="page-title">
                <h3>Dashboard</h3>
                <h4 class="admin">Super admin</h4>
            </div>
            <div class="search-bar">
                <div class="search">
                    <input type="text" placeholder="search orders or customers">
                </div>
                <div class="logo">
                    <img src="images/khan.jpg" alt="">
                </div>
            </div>
        </header>

        <!-- Orders content -->
        <main class="content">
            <section class="cards">
                <!-- CARD ONE -->
                <div class="card">
                        <span class="">Orders today</span>
                        <h2 class="">2,000</h2>
                        <h4 class="decrease">-2% vs yesterday</h4>
                    </div>
                    <!-- CARD TWO -->
                    <div class="card">
                        <span class="">GMS this week</span>
                        <h2 class=""> AFG 2,050900</h2>
                        <h4 class="decrease">-7%</h4>
                    </div>
                    <!-- CARD THREE -->
                     <div class="card">
                        <span class="">Live restaurants</span>
                        <h2 class="">200</h2>
                        <h4 class="live-rest"> 4 awaiting approval</h4>
                    </div>
                    <div class="card">
                        <span class="">Registered customers</span>
                        <h2 class="">22100</h2>
                        <h4 class="increase">+211 this week</h4>
                    </div>
            </section>

            <!-- ORDERS PER DAY -->
             <section class="daily-orders">
                <div class="days">
                    <div class="Mon day"></div>
                    <div class="Tue day"></div>
                    <div class="Wed day"></div>
                    <div class="Thu day"></div>
                    <div class="Fri day"></div>
                    <div class="Sat day"></div>
                    <div class="Sun day"></div>

                </div>
             </section>
        </main>
</body>

</html>
